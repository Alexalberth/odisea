/* CSS de la interfaz «Mundo de bloques», copiado de docs/direcciones-odisea-2.html. */
/* ---------- la interfaz ---------- */
.scr { height: 100%; border-radius: 31px; overflow: hidden; display: flex; flex-direction: column; font-family: var(--fp); color: var(--tx); background: var(--sky); position: relative; }
.tManana { --sky: linear-gradient(#9fc2e4, #c9dbea 55%, #e2e8ec); --pn: #cfcac0; --pn-hi: #f3f0ea; --pn-lo: #77716a; --out: #1f1d1a; --tx: #2a2723; --mut: #625d55;
  --slot: #908a82; --slot-hi: #d4cfc7; --slot-lo: #45413b; --bar: var(--t-madera, #8a6a48); --sel: #ffffff; --head: #ffffff; --sombra: rgba(40,50,70,.55); }
.tTarde { --sky: linear-gradient(#4d5490, #b67a86 45%, #e9a774 80%, #f1c591); --pn: #d1c3b2; --pn-hi: #f5ebdf; --pn-lo: #7a6656; --out: #21170f; --tx: #2c221a; --mut: #6a594b;
  --slot: #95806d; --slot-hi: #d9c6b2; --slot-lo: #46372b; --bar: var(--t-madera, #8a6a48); --sel: #fff2c9; --head: #fff8ec; --sombra: rgba(60,30,20,.6); }
.tNoche { --sky: linear-gradient(#070a1f, #141a3f 55%, #23295a); --pn: #3a3f52; --pn-hi: #636a86; --pn-lo: #191b25; --out: #050609; --tx: #eef0ff; --mut: #a9afcc;
  --slot: #262a38; --slot-hi: #4c5370; --slot-lo: #0e1017; --bar: var(--t-pizarra, #2b2e38); --sel: #8ff0ff; --head: #ffffff; --sombra: rgba(0,0,0,.7); }
.sb { display: flex; justify-content: space-between; padding: 10px 22px 2px; font-size: 13px; font-weight: 600; color: var(--head); text-shadow: 1px 1px 0 var(--sombra); position: relative; z-index: 1; }
.body { flex: 1; min-height: 0; padding: 6px 12px 10px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; position: relative; z-index: 1; }
.nube { position: absolute; z-index: 0; height: 12px; background: #fff; opacity: .55; }
.nube::before { content: ""; position: absolute; left: 25%; top: -9px; width: 45%; height: 9px; background: inherit; }
.tTarde .nube { background: #ffd9b8; opacity: .5; }
.estrellas { position: absolute; inset: 0 0 50% 0; z-index: 0; background-image: radial-gradient(#fff 1px, transparent 1.5px), radial-gradient(#fff 1px, transparent 1.5px); background-size: 37px 41px, 53px 47px; background-position: 5px 9px, 21px 30px; opacity: .5; }
.pn { background: var(--pn); border: 3px solid; border-color: var(--pn-hi) var(--pn-lo) var(--pn-lo) var(--pn-hi); outline: 2px solid var(--out); }
.slot { background: var(--slot); border: 3px solid; border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); display: grid; place-items: center; }
.px { width: 20px; height: 20px; shape-rendering: crispEdges; display: block; }
.res { display: flex; gap: 2px; align-items: center; justify-content: space-between; }
.stat { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; color: var(--head); text-shadow: 2px 2px 0 var(--sombra); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .px { width: 18px; height: 18px; }
.tit h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hi h3, .tit h3 { margin: 0; font-size: 24px; line-height: 1.05; font-weight: 700; color: var(--head); text-shadow: 2px 2px 0 var(--sombra); }
.hi p { margin: 3px 0 0; font-size: 14px; color: var(--head); text-shadow: 1px 1px 0 var(--sombra); }
.tit { display: flex; justify-content: space-between; align-items: end; gap: 8px; }
.tit small { font-size: 13px; color: var(--head); text-shadow: 1px 1px 0 var(--sombra); white-space: nowrap; }
.quest { padding: 10px; display: grid; gap: 8px; }
.quest .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
.quest .row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.quest .slot { width: 44px; height: 44px; }
.quest .slot .px { width: 28px; height: 28px; }
.quest .t { font-size: 18px; line-height: 1.1; font-weight: 700; }
.quest .m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--mut); margin-top: 3px; }
.quest .m span { display: inline-flex; align-items: center; gap: 3px; }
.quest .m .px { width: 14px; height: 14px; }
.btn { font: 600 17px/1 var(--fp); color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.55); cursor: pointer; padding: 10px 14px; background: #4f9a2a; border: 3px solid; border-color: #8ad154 #275214 #275214 #8ad154; outline: 2px solid var(--out); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn .px { width: 16px; height: 16px; }
.btn:focus-visible { outline: 3px solid var(--sel); }
.btn.off { background: #7d7d7d; border-color: #b4b4b4 #444 #444 #b4b4b4; color: #e2e2e2; cursor: default; }
.btn.oro { background: #c9951f; border-color: #f2cf6b #6e4e08 #6e4e08 #f2cf6b; }
.btn.gema { background: #8a55d6; border-color: #c6a4f5 #482478 #482478 #c6a4f5; }
.btn.mini { font-size: 14px; padding: 6px 8px; width: auto; gap: 4px; }
.btn.mini .px { width: 14px; height: 14px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.duo .btn { font-size: 14px; padding: 8px 6px; }
.list { padding: 6px; display: grid; gap: 6px; }
.mis { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.mis .slot { width: 38px; height: 38px; }
.mis .slot .px { width: 22px; height: 22px; }
.mis b { display: block; font-size: 15px; line-height: 1.1; font-weight: 600; }
.mis small { display: block; color: var(--mut); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw { display: inline-flex; align-items: center; gap: 3px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rw .px { width: 16px; height: 16px; }
.dia { padding: 8px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dia .slot { width: 38px; height: 38px; }
.dia .slot .px { width: 22px; height: 22px; }
.dia b { font-size: 15px; font-weight: 600; }
.caras { display: flex; gap: 3px; margin-top: 4px; }
.caras i { width: 22px; height: 22px; font-style: normal; font-size: 13px; font-weight: 700; }
.caras i.on { background: #4f9a2a; border-color: #275214 #8ad154 #8ad154 #275214; color: #fff; }
.bono { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 13.5px; }
.bono .px { width: 18px; height: 18px; }
.bono b { margin-left: auto; font-variant-numeric: tabular-nums; }
.hotbar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 7px 6px 15px; background: var(--bar); background-size: 32px 32px; border-top: 3px solid var(--out); position: relative; z-index: 1; image-rendering: pixelated; }
.hotbar a { text-decoration: none; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: #fff; text-shadow: 1px 1px 0 #000; }
.hotbar .slot { width: 40px; height: 40px; }
.hotbar .slot .px { width: 22px; height: 22px; }
.hotbar a.on .slot { outline: 3px solid var(--sel); }
.eras { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 4px; background: rgba(0,0,0,.35); outline: 2px solid var(--out); }
.eras button { aspect-ratio: 1; padding: 0; cursor: pointer; }
.eras button svg { width: 70%; height: 70%; }
.eras button[aria-pressed="true"] { outline: 3px solid var(--sel); position: relative; z-index: 1; }
.eras button.lock svg { opacity: .35; }
.eras button:focus-visible { outline: 3px solid #ffe066; }
.isla { line-height: 0; margin-inline: -4px; }
.isla img { width: 100%; height: auto; max-height: 236px; object-fit: contain; display: block; }
.req { padding: 10px; display: grid; gap: 7px; }
.req > b { font-size: 16px; font-weight: 700; }
.rq { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.rq .px { width: 16px; height: 16px; }
.rq > span:last-of-type { color: var(--mut); font-variant-numeric: tabular-nums; font-weight: 600; }
.xp { grid-column: 1 / -1; height: 12px; background: #1a1a1a; border: 2px solid #000; position: relative; }
.xp i { position: absolute; inset: 0 auto 0 0; background: #7fd13b; box-shadow: inset 0 3px 0 #b6f07a, inset 0 -3px 0 #4f8f1f; }
.xp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #000 calc(10% - 2px) 10%); }
.xp.med i { background: #e8a23a; box-shadow: inset 0 3px 0 #f6cd7f, inset 0 -3px 0 #a5650f; }
.xp.baja i { background: #d9452b; box-shadow: inset 0 3px 0 #f08a72, inset 0 -3px 0 #8e2110; }
.anis { padding: 6px; display: grid; gap: 6px; }
.ani { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.ani .slot { width: 46px; height: 40px; }
.ani .slot img { width: 40px; height: 34px; object-fit: contain; }
.ani b { font-size: 14.5px; font-weight: 600; display: block; line-height: 1.1; }
.ani .xp { margin-top: 4px; height: 10px; }
.ani small { font-size: 11.5px; color: var(--mut); }
.mapa-vista { contain: inline-size; min-width: 0; height: 318px; overflow: auto; margin-inline: -12px; scrollbar-width: none; cursor: grab; touch-action: pan-x pan-y; }
.mapa-vista.arrastrando { cursor: grabbing; }
.mapa-vista::-webkit-scrollbar { display: none; }
.mapa { position: relative; line-height: 0; }
.mapa img { display: block; width: 100%; height: auto; user-select: none; }
.arrastra { text-align: center; font-size: 12px; color: var(--head); text-shadow: 1px 1px 0 var(--sombra); margin-top: -4px; }
.pin { position: absolute; transform: translate(-50%, -100%); z-index: 2; line-height: 1.1; }
.marca { display: inline-flex; align-items: center; gap: 4px; padding: 2px 5px 2px 3px; cursor: pointer; font-family: var(--fp); color: var(--tx); text-align: left; white-space: nowrap; }
.marca .px { width: 16px; height: 16px; }
.marca b { display: block; font-size: 11.5px; font-weight: 700; }
.marca small { display: block; font-size: 10px; color: var(--mut); }
.marca.on { outline: 3px solid var(--sel); }
.marca.lock { opacity: .85; border-style: dashed; }
.marca:focus-visible { outline: 3px solid #ffe066; }
.resumen { padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 5px; font-size: 14px; }
.resumen small { grid-column: 1 / -1; color: var(--mut); font-size: 12.5px; }
.escena { line-height: 0; margin-inline: -8px; }
.escena img { width: 100%; height: auto; max-height: 196px; object-fit: contain; display: block; }
.amp { padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; font-size: 14px; }
.tip, .dato { padding: 8px; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; line-height: 1.25; }
.dato { grid-template-columns: 20px minmax(0, 1fr); color: var(--mut); }
.dato b { display: block; color: var(--tx); font-size: 13.5px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabs button { font: 600 13px/1 var(--fp); color: var(--tx); padding: 7px 2px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: #4f9a2a; border-color: #275214 #8ad154 #8ad154 #275214; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.5); }
.tabs button:focus-visible { outline: 3px solid var(--sel); }
.galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
.carta { padding: 4px 4px 6px; display: grid; gap: 4px; justify-items: center; cursor: pointer; font-family: var(--fp); color: var(--tx); }
.carta .slot { width: 100%; height: 64px; position: relative; }
.carta img { width: 92%; height: 56px; object-fit: contain; }
.carta b { font-size: 11.5px; line-height: 1.05; font-weight: 700; text-align: center; }
.carta.no img { filter: grayscale(1) opacity(.55); }
.carta.incuba .slot { outline: 2px dashed #e8c547; outline-offset: -5px; }
.carta:focus-visible { outline: 3px solid var(--sel); }
.hoja { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 92px; z-index: 5; padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; font-size: 13px; }
.hoja .cerrar { position: absolute; right: 8px; top: 8px; z-index: 1; }
.hoja-img { background: var(--slot); border: 3px solid; border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); padding: 4px; line-height: 0; }
.hoja-img img { width: 100%; height: 150px; object-fit: contain; }
.hoja-img.no img { filter: grayscale(1) opacity(.6); }
.hoja .hn { display: block; font-size: 20px; font-weight: 700; line-height: 1.05; }
.hoja i { color: var(--mut); }
.hoja dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12.5px; }
.hoja dt { color: var(--mut); }
.hoja dd { margin: 0; }
.hoja p { margin: 0; line-height: 1.3; }
.hoja .pie { display: flex; gap: 8px; align-items: center; margin-top: auto; font-size: 12.5px; }
.hoja .pie span:last-child { display: inline-flex; align-items: center; gap: 4px; }
.hoja .pie .px { width: 14px; height: 14px; }
.rar { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.5); outline: 2px solid var(--out); }
.cat-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.cat-h h2 { margin: 0; font-size: 28px; font-weight: 700; text-shadow: 2px 2px 0 #000; }
.cat-h p { margin: 0; color: var(--page-mut); font-size: 15px; max-width: 70ch; }
.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.esp-c { background: var(--page-2); border: 2px solid var(--page-line); display: grid; grid-template-rows: auto 1fr; }
.esp-img { background: linear-gradient(#cfd9e0, #e8ecee); min-height: 170px; display: grid; place-items: center; padding: 8px; line-height: 0; }
.esp-img img { width: 100%; height: 160px; object-fit: contain; }
.esp-t { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; font-size: 14px; color: var(--page-mut); }
.esp-t h3 { margin: 2px 0 0; font-size: 19px; color: var(--page-tx); line-height: 1.1; }
.esp-t i { color: var(--page-mut); }
.esp-t p { margin: 0; line-height: 1.35; }
.esp-t .per { color: var(--page-tx); }
.esp-t .rar { justify-self: start; outline-color: #000; }
.foot { color: var(--page-mut); font-size: 15px; max-width: 74ch; display: grid; gap: 6px; }
.foot b { color: var(--page-tx); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .nube { animation: nube 40s linear infinite alternate; }
  @keyframes nube { from { transform: translateX(0) } to { transform: translateX(60px) } }
  .brilla { animation: brilla 2.4s ease-in-out infinite; }
  @keyframes brilla { 50% { opacity: .55 } }
}
.epocas { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding: 3px; background: rgba(0,0,0,.35); outline: 2px solid var(--out); }
.epocas button { aspect-ratio: 1; padding: 0; cursor: pointer; font: 700 12px/1 var(--fp); color: var(--tx); }
.epocas .px { width: 12px; height: 12px; }
.epocas button[aria-pressed="true"] { outline: 3px solid var(--sel); position: relative; z-index: 1; }
.epocas button:focus-visible { outline: 3px solid #ffe066; }
.globo { position: relative; margin-inline: -6px; touch-action: none; }
.globo canvas { width: 100%; height: auto; display: block; cursor: grab; }
.globo.gris canvas { filter: grayscale(.85) brightness(.8); }
.pins { position: absolute; inset: 0; pointer-events: none; }
.marca-g { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; font: 700 10.5px/1 var(--fp); padding: 3px 5px; color: var(--tx); white-space: nowrap; cursor: pointer; }
.marca-g.on { outline: 3px solid var(--sel); background: #e8c547; color: #2a2620; }
.marca-g:focus-visible { outline: 3px solid #ffe066; }
.civs { padding: 6px; display: grid; gap: 5px; align-content: start; overflow: hidden; flex: 1; min-height: 0; -webkit-mask-image: linear-gradient(#000 85%, transparent); mask-image: linear-gradient(#000 85%, transparent); }
.civs .rt { font-size: 15px; }
.civ { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: transparent; border: 0; padding: 2px; cursor: pointer; font-family: var(--fp); color: var(--tx); }
.civ .slot { width: 52px; height: 40px; }
.civ .slot img { width: 46px; height: 34px; object-fit: contain; }
.civ b { display: block; font-size: 14px; line-height: 1.1; }
.civ small { font-size: 11.5px; color: var(--mut); }
.civ em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--mut); }
.civ.on { outline: 3px solid var(--sel); }
.civ:focus-visible { outline: 3px solid #ffe066; }
.vacio { color: var(--mut); font-size: 13px; }
.escena.chica img { max-height: 150px; }
.lugar { margin: -4px 0 0; font-size: 13px; color: var(--head); text-shadow: 1px 1px 0 var(--sombra); }
/* ---------- escenas vivas e interacción ---------- */
em.etapa.recien { background: #f7d6e0; } em.etapa.juvenil { background: #a9d4f0; } em.etapa.subadulto { background: #9fd8a8; }
.hoja { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.hoja > * { flex: none; }

.compara { display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; font-size: 11.5px; }

.compara small { grid-column: 1 / -1; color: var(--mut); }
.sabias { display: flex; gap: 6px; align-items: flex-start; background: rgba(232,197,71,.14); padding: 6px; outline: 1px solid rgba(232,197,71,.4); }
.sabias .px { width: 16px; height: 16px; flex: none; }
.disenos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }

.disenos .dis img { width: 100%; height: 34px; object-fit: contain; }
.disenos .dis small { font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.disenos .dis.falta img { opacity: .55; }
.disenos .dis em { position: absolute; top: 1px; right: 1px; font: 700 9px/1 var(--fp); font-style: normal; display: flex; align-items: center; gap: 1px; background: rgba(0,0,0,.55); color: #fff; padding: 1px 2px; }
.disenos .dis em .px { width: 9px; height: 9px; }
.disenos .dis[aria-pressed="true"] { outline: 3px solid #4f9a2a; }
.parientes { display: flex; flex-wrap: wrap; gap: 4px; }
.parientes button { font: 600 11.5px/1 var(--fp); padding: 5px 6px; color: var(--tx); cursor: pointer; }
.tabs em { font-style: normal; opacity: .7; font-size: .85em; }
.amp small { display: block; color: var(--mut); font-size: 10.5px; }
.carta b { overflow-wrap: anywhere; hyphens: auto; max-width: 100%; }
p.vacio { margin: 0; padding: 8px; font-size: 12.5px; color: var(--mut); }

const DISENOS = [

  { n: 'Melánico', costo: 15 },
  { n: 'Camuflaje', costo: 20 },
  { n: 'Dorado', costo: 30 },

const lumDe = (c) => { const n = parseInt(c.slice(1), 16); return (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255; };
const TINTES = new Map();
// Cambia los colores del modelo y deja intactos ojos, dientes y garras claras.
function tinte(m, k) {
  if (!k) return m;
  if (!TINTES.has(m)) TINTES.set(m, []);
  const memoT = TINTES.get(m);
  if (memoT[k]) return memoT[k];
  const out = new Map(), CAMU = ['#4a5a2e', '#6b6a3a', '#3a3a24', '#7a7048'];
  for (const [key, v] of m) {
    let c = v.c;
    if (v.ojo) c = k === 1 ? '#d04040' : c;
    else if (lumDe(c) > 0.86) c = v.c;
    else if (k === 1) c = mix(c, '#f4efe8', 0.72);
    else if (k === 2) c = mix(c, '#1d1b1c', 0.72);
    else if (k === 3) c = mix(c, CAMU[Math.floor(hash(v.x >> 1, v.y >> 1, (v.z >> 1) + 5) * 4)], 0.7);
    else if (k === 4) c = mix('#6b4210', '#ffd75a', Math.min(1, lumDe(c) * 1.5));
    out.set(key, { ...v, c });
  }
  return (memoT[k] = conMeta(out, m.meta));
}

// Cofres de 16×16: tapa con brillo arriba, correas de metal, cerradura y sombra abajo a la derecha.
// Abiertos, la tapa se echa atrás y se ve lo que traen dentro.
function cofreArte(abierto) {
  const W = 16, g = Array.from({ length: 16 }, () => Array(W).fill('.'));
  const p = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < 16) g[y][x] = c; };
  const caja = (x0, y0, x1, y1, f) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) p(x, y, f(x, y)); };
  const B0 = 8, B1 = 14;
  // cuerpo
  caja(1, B0, 14, B1, (x, y) => (x === 1 || x === 14 || y === B1 ? 'K' : x === 2 ? 'l' : x === 13 || y === B1 - 1 ? 'w' : 'W'));
  if (!abierto) {
    // tapa redondeada
    for (let x = 3; x <= 12; x++) p(x, 2, 'K');
    p(2, 3, 'K'); p(13, 3, 'K');
    caja(1, 4, 14, 7, (x, y) => (x === 1 || x === 14 ? 'K' : y === 4 ? 'l' : x === 13 ? 'w' : 'W'));
    caja(3, 3, 12, 3, () => 'l');
  } else {
    // tapa echada atrás y el interior con el premio
    for (let x = 3; x <= 12; x++) p(x, 0, 'K');
    caja(2, 1, 13, 3, (x, y) => (x === 2 || x === 13 ? 'K' : y === 1 ? 'w' : 'W'));
    caja(1, 4, 14, 7, (x, y) => (x === 1 || x === 14 ? 'K' : y === 4 ? 'D' : (x * 3 + y * 5) % 4 === 0 ? 'Y' : 'y'));
    for (const [x, y] of [[5, 5], [9, 4], [11, 6], [4, 7]]) p(x, y, 'Y');
  }
  // franja de metal entre tapa y cuerpo
  caja(1, B0, 14, B0, (x) => (x === 1 || x === 14 ? 'K' : 'M'));
  caja(2, B0 + 1, 13, B0 + 1, () => 'm');
  // correas
  for (const sx of [4, 11]) for (let y = abierto ? B0 : 3; y <= B1 - 1; y++) if (g[y][sx] !== 'K') { p(sx, y, 'M'); p(sx + 1, y, 'm'); }
  // cerradura
  if (!abierto) {
    caja(6, 6, 9, 10, (x, y) => (x === 6 || x === 9 || y === 6 || y === 10 ? 'K' : 'L'));
    p(7, 7, 'C'); p(8, 9, 'o'); p(7, 9, 'o'); p(8, 8, 'K');
  }
  return g.map((f) => f.join(''));
}

// Ruleta de 16×16: rueda de cuatro colores con borde, centro y la flecha arriba.
function ruletaArte() {
  const g = [];
  for (let y = 0; y < 16; y++) {
    let f = '';
    for (let x = 0; x < 16; x++) {
      const dx = x + 0.5 - 8, dy = y + 0.5 - 9, d = Math.hypot(dx, dy);
      if (y <= 2 && Math.abs(x + 0.5 - 8) <= 2.6 - y) { f += 'F'; continue; }
      if (d > 6.9) { f += '.'; continue; }
      if (d > 5.9) { f += 'K'; continue; }
      if (d < 1.6) { f += 'C'; continue; }
      const a = (Math.atan2(dy, dx) + Math.PI) / (Math.PI / 2);
      f += 'RYGB'[Math.floor(a) % 4];
    }
    g.push(f);
  }
  return g;
}

function huevoArte(roto) {
  const g = [];
  const dentro = (x, y) => ((x + 0.5 - 8) / 5.6) ** 2 + ((y + 0.5 - 8.6) / (y < 8 ? 7.4 : 6.6)) ** 2 <= 1;
  for (let y = 0; y < 16; y++) {
    let f = '';
    for (let x = 0; x < 16; x++) {
      if (!dentro(x, y)) { f += '.'; continue; }
      const borde = !dentro(x - 1, y) || !dentro(x + 1, y) || !dentro(x, y - 1) || !dentro(x, y + 1);
      const mancha = [[5, 5], [9, 4], [10, 9], [6, 11], [8, 13], [11, 12], [4, 8]].some(([a, c]) => Math.abs(a - x) + Math.abs(c - y) <= (a === 10 ? 1 : 0));
      const grieta = roto && y === 8 + ((x % 4 === 1 || x % 4 === 2) ? -1 : 0) && x > 2 && x < 13;

    }
    g.push(f);
  }

}

  const ifd0 = lee(u32(4), [0x010f, 0x0110, 0x0132, 0x8769]);
  const exif = ifd0[0x8769] ? lee(ifd0[0x8769], [0x9003]) : {};
  const f = exif[0x9003] || ifd0[0x0132];
  const m = f && f.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  return {
    fecha: m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : null,
    camara: [ifd0[0x010f], ifd0[0x0110]].filter(Boolean).join(' ').trim() || null,
  };
}

// ---- imagen: brillo, contraste, nitidez y huella (dHash) ----
async function bitmapDe(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) { /* Safari viejo */ }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}
function grises(fuente, w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.drawImage(fuente, 0, 0, w, h);
  const d = c.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < g.length; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  return g;
}
function medidas(fuente, ancho, alto) {
  const k = 256 / Math.max(ancho, alto), w = Math.max(8, Math.round(ancho * k)), h = Math.max(8, Math.round(alto * k));
  const g = grises(fuente, w, h);
  let s = 0, s2 = 0;
  for (const v of g) { s += v; s2 += v * v; }
  const media = s / g.length, contraste = Math.sqrt(Math.max(0, s2 / g.length - media * media));
  let l = 0, l2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, v = g[i - 1] + g[i + 1] + g[i - w] + g[i + w] - 4 * g[i];
    l += v; l2 += v * v; n++;
  }
  const nitidez = l2 / n - (l / n) ** 2;
  // dHash: 9×8 en grises; cada bit dice si un punto es más claro que su vecino de la derecha.
  const p = grises(fuente, 9, 8);
  let hi = 0, lo = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const bit = p[y * 9 + x] > p[y * 9 + x + 1] ? 1 : 0, k2 = y * 8 + x;
    if (k2 < 32) hi = (hi | (bit << k2)) >>> 0; else lo = (lo | (bit << (k2 - 32))) >>> 0;
  }
  const hex = (n2) => n2.toString(16).padStart(8, '0');
  return { media, contraste, nitidez, huella: hex(hi) + hex(lo) };
}
const unos = (n) => { n -= (n >>> 1) & 0x55555555; n = (n & 0x33333333) + ((n >>> 2) & 0x33333333); return (((n + (n >>> 4)) & 0x0f0f0f0f) * 0x01010101) >>> 24; };
function distancia(a, b) {
  return unos((parseInt(a.slice(0, 8), 16) ^ parseInt(b.slice(0, 8), 16)) >>> 0) + unos((parseInt(a.slice(8), 16) ^ parseInt(b.slice(8), 16)) >>> 0);
}

// Momento desde el que la foto tiene sentido: inicio del evento o del temporizador.
function inicioDe(m) {
  if (m.tipo === 'cal' && m.ini) return m.ini.getTime() - FOTO.margenInicioMin * 60000;
  if (ES.enCurso && ES.enCurso.id === m.id) return ES.enCurso.desde - FOTO.margenInicioMin * 60000;
  return null;
}

/** Revisa la foto. Devuelve { ok, reglas: [{ ok, t, d }], huella, cuando, camara }. */
async function revisaFoto(file, m, ahora = Date.now()) {
  const reglas = [];
  const regla = (ok, t, d) => reglas.push({ ok, t, d });
  if (!file || !/^image\//.test(file.type || 'image/')) {
    regla(false, 'Es una imagen', 'Ese archivo no es una foto.');
    return { ok: false, reglas };
  }
  const exif = await leeExif(file);
  const cuando = exif.fecha || file.lastModified || ahora;
  const edad = (ahora - cuando) / 60000;
  regla(edad <= FOTO.vigenciaMin && edad >= -2, 'Recién tomada',
    edad > FOTO.vigenciaMin ? `Tiene ${edad < 120 ? Math.round(edad) + ' min' : Math.round(edad / 60) + ' h'}: saca una foto nueva ahora, no de la galería.` : exif.fecha ? 'La cámara dice que es de hace un momento.' : 'Es de hace un momento.');
  const ini = inicioDe(m);
  if (ini) regla(cuando >= ini, 'Después de empezar', cuando >= ini ? 'Es de cuando ya estabas en la misión.' : 'Es de antes de que empezara la misión.');
  const captura = /png|gif/i.test(file.type);
  regla(!captura, 'Es una foto', captura ? 'Parece una captura de pantalla: usa la cámara.' : exif.camara ? `Tomada con ${exif.camara}.` : 'Archivo de foto.');
  let img;
  try { img = await bitmapDe(file); } catch (_) {
    regla(false, 'Se puede abrir', 'No pude abrir la foto. Prueba de nuevo.');
    return { ok: false, reglas };
  }
  const ancho = img.width, alto = img.height;
  if (Math.min(ancho, alto) < FOTO.minLado) regla(false, 'Tamaño suficiente', `Es muy pequeña (${ancho}×${alto}).`);
  const M = medidas(img, ancho, alto);
  if (img.close) img.close();
  regla(M.media >= FOTO.minLuz && M.media <= FOTO.maxLuz, 'Se ve algo', M.media < FOTO.minLuz ? 'Está casi negra: ¿tapaste la cámara?' : M.media > FOTO.maxLuz ? 'Está casi blanca: hay demasiada luz.' : 'Tiene buena luz.');
  regla(M.contraste >= FOTO.minContraste && M.nitidez >= FOTO.minNitidez, 'Con detalle y enfocada',
    M.contraste < FOTO.minContraste ? 'Es casi de un solo color: enfoca algo concreto.' : M.nitidez < FOTO.minNitidez ? 'Está borrosa: sostén el celular quieto.' : 'Se ve nítida.');
  // La huella solo distingue fotos con detalle: una imagen lisa da una huella casi vacía.
  if (M.contraste >= FOTO.minContraste) {
    const igual = (ES.fotos || []).map((f) => ({ f, d: distancia(f.h, M.huella) })).sort((a, b) => a.d - b.d)[0];
    const repetida = igual && igual.d <= FOTO.maxParecido;
    regla(!repetida, 'No repetida', repetida ? `Es igual a una que ya usaste${igual.f.t ? ' el ' + new Date(igual.f.t).toLocaleDateString('es-PE', { day: 'numeric', month: 'short' }) : ''}.` : 'Es una foto que no habías usado.');
  }
  return { ok: reglas.every((r) => r.ok), reglas, huella: M.huella, cuando, camara: exif.camara, medidas: M };
}

/** Guarda la huella para que la misma foto no sirva dos veces. */
function recuerdaFoto(res, m) {
  ES.fotos = [...(ES.fotos || []), { h: res.huella, t: res.cuando, m: m.id }].slice(-FOTO.recuerda);
}

// ================= Google: sesión, Calendar y guardado en Drive =================
// Todo ocurre en el navegador de cada persona, con su propia cuenta:

// - el progreso se guarda en la carpeta privada de la app en su Drive (appDataFolder),

const ALCANCES = 'openid email profile https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata';
const GOO = { token: null, exp: 0, correo: null, nombre: null, foto: null, cliente: null, estado: 'fuera', archivo: null, error: null };
const idCliente = () => { try { return localStorage.getItem('odisea.mundo.clientId') || (window.ODISEA_CONFIG || {}).googleClientId || ''; } catch (_) { return (window.ODISEA_CONFIG || {}).googleClientId || ''; } };
const MODO_DEMO = /[?&]demo\b/.test(location.search);

try {
  const s = JSON.parse(localStorage.getItem('odisea.mundo.sesion') || 'null');
  if (s && s.correo) Object.assign(GOO, { correo: s.correo, nombre: s.nombre, foto: s.foto, estado: 'dormida', agenda: !!s.agenda });
  if (s && s.token && s.exp > Date.now() + 60000) Object.assign(GOO, { token: s.token, exp: s.exp, estado: 'lista' });
} catch (_) { /* nada */ }
const guardaSesion = () => { try { localStorage.setItem('odisea.mundo.sesion', JSON.stringify({ correo: GOO.correo, nombre: GOO.nombre, foto: GOO.foto, token: GOO.token, exp: GOO.exp, agenda: GOO.agenda })); } catch (_) { /* nada */ } };
const tokenVivo = () => GOO.token && GOO.exp > Date.now() + 60000;

let gisCargado = null;
function cargaGis() {
  if (gisCargado) return gisCargado;
  gisCargado = new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => ok(); s.onerror = () => { gisCargado = null; mal(new Error('No se pudo cargar el inicio de sesión de Google. ¿Hay conexión?')); };
    document.head.appendChild(s);
  });
  return gisCargado;
}
// Pide permiso (la primera vez muestra la pantalla de Google; después se cierra sola).
async function conectaGoogle({ primeraVez = false } = {}) {
  if (!idCliente()) throw new Error('Falta el ID de cliente de Google (Ajustes → Cuenta).');
  await cargaGis();
  const r = await new Promise((ok, mal) => {
    const cli = google.accounts.oauth2.initTokenClient({
      client_id: idCliente(), scope: ALCANCES,
      callback: (x) => (x.error ? mal(new Error(x.error_description || x.error)) : ok(x)),
      error_callback: (x) => mal(new Error(x.type === 'popup_closed' ? 'Cerraste la ventana de Google.' : x.message || 'Google no respondió.')),
    });
    cli.requestAccessToken({ prompt: primeraVez ? 'consent' : '', hint: GOO.correo || undefined });
  });
  if (!google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/calendar.readonly', 'https://www.googleapis.com/auth/drive.appdata')) {
    throw new Error('Para usar tu calendario y guardar tu progreso, marca todas las casillas en la pantalla de Google.');
  }
  GOO.agenda = google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/calendar.events');
  GOO.token = r.access_token; GOO.exp = Date.now() + (r.expires_in || 3600) * 1000;
  const yo = await gapi('https://www.googleapis.com/oauth2/v3/userinfo');
  Object.assign(GOO, { correo: yo.email, nombre: yo.given_name || yo.name || '', foto: yo.picture || null, estado: 'lista', error: null });
  guardaSesion();

}
function desconectaGoogle() {
  try { if (GOO.token && window.google) google.accounts.oauth2.revoke(GOO.token, () => {}); } catch (_) { /* nada */ }
  Object.assign(GOO, { token: null, exp: 0, correo: null, nombre: null, foto: null, estado: 'fuera', archivo: null });
  try { localStorage.removeItem('odisea.mundo.sesion'); localStorage.removeItem('odisea.mundo.cal'); } catch (_) { /* nada */ }
}
async function gapi(url, { metodo = 'GET', cuerpo = null, tipo = null, texto = false } = {}) {
  if (!tokenVivo()) { GOO.estado = GOO.correo ? 'dormida' : 'fuera'; throw new Error('sesion'); }
  const h = { Authorization: 'Bearer ' + GOO.token };
  if (tipo) h['Content-Type'] = tipo;
  const r = await fetch(url, { method: metodo, headers: h, body: cuerpo });
  if (r.status === 401) { GOO.token = null; GOO.estado = 'dormida'; guardaSesion(); throw new Error('sesion'); }
  if (!r.ok) throw new Error(`Google respondió ${r.status}`);
  return texto ? r.text() : r.json();
}

// ---------- Calendar ----------
async function listaCalendarios() {
  if (MODO_DEMO) return [{ id: 'demo', n: 'Personal (demo)', color: '#4f9a2a', principal: true }, { id: 'demo-u', n: 'Universidad (demo)', color: '#3a7bd5' }];
  const r = await gapi('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=100');
  return (r.items || []).map((c) => ({ id: c.id, n: c.summaryOverride || c.summary, color: c.backgroundColor, principal: !!c.primary }));
}
const calendariosElegidos = (todos) => ES.prefs.calendarios || todos.filter((c) => c.principal).map((c) => c.id);
async function traeEventosHoy() {
  const hoy = isoDe();
  let lista = [];
  if (MODO_DEMO) lista = eventosDemo();
  else {
    const todos = await listaCalendarios(), ids = calendariosElegidos(todos), ini = fechaDe(hoy); ini.setHours(0, 0, 0, 0);
    const fin = new Date(ini); fin.setDate(fin.getDate() + 1);
    for (const id of ids) {
      const c = todos.find((x) => x.id === id);
      if (!c) continue;
      const q = new URLSearchParams({ timeMin: ini.toISOString(), timeMax: fin.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '50' });
      const r = await gapi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}/events?${q}`);
      for (const ev of r.items || []) {
        if (ev.status === 'cancelled' || ev.transparency === 'transparent' && !ev.start.dateTime) continue;
        const yo = (ev.attendees || []).find((a) => a.self);
        if (yo && yo.responseStatus === 'declined') continue;
        const todoElDia = !ev.start.dateTime;
        lista.push({ id: ev.id, titulo: ev.summary || '', cal: c.n, todoElDia, ini: todoElDia ? ini.toISOString() : ev.start.dateTime, fin: todoElDia ? fin.toISOString() : ev.end.dateTime });
      }
    }
    lista.sort((a, b) => new Date(a.ini) - new Date(b.ini));
  }
  EVENTOS = { fecha: hoy, lista, t: Date.now(), error: null };
  try { localStorage.setItem('odisea.mundo.cal', JSON.stringify(EVENTOS)); } catch (_) { /* nada */ }
  return EVENTOS;
}
const DEMO_EXTRA = [];

// Crea un evento en el calendario principal (solo cuando la persona lo pide desde «Agendar»).
async function creaEvento({ titulo, inicio, min, meta }) {

  const mes = UI.mes || isoDe().slice(0, 7), [a, m] = mes.split('-').map(Number), primero = new Date(a, m - 1, 1), dias = new Date(a, m, 0).getDate();
  const vacios = (primero.getDay() + 6) % 7;
  let celdas = '';
  for (let k = 0; k < vacios; k++) celdas += '<span></span>';
  for (let d = 1; d <= dias; d++) {
    const iso = `${mes}-${String(d).padStart(2, '0')}`, e = ES.diario[iso], fut = iso > isoDe(), hz = Object.keys(hechasDe(iso)).length;
    celdas += `<button type="button" class="dc ${iso === f ? 'on' : ''} ${fut ? 'fut' : ''}" data-dia="${iso}" ${fut ? 'disabled' : ''} style="${e && e.animo ? `background:${COLOR_ANIMO[e.animo]}` : ''}" aria-label="${d}${e ? ', con entrada' : ''}">${d}${hz ? '<i></i>' : ''}</button>`;
  }
  const preg = PREGUNTAS[(dt.getDate() + dt.getMonth()) % PREGUNTAS.length];

  return marco(`${recursos()}
    ${titulo('Diario', `racha ${rachaDiario()} días`)}
    <div class="col-a"><div class="pn hojadiario">
      <b>${hoy ? 'Hoy' : DIAS[dt.getDay()] + ' ' + dt.getDate() + ' de ' + MESES[dt.getMonth()]}</b>
      <span class="caras grandes">${[1, 2, 3, 4, 5].map((k) => `<button type="button" class="slot ${k === D.animo ? 'on' : ''}" data-animo="${k}" aria-label="${CARAS[k]}" title="${CARAS[k]}">${k}</button>`).join('')}</span>
      <label>¿Qué hiciste?<textarea class="campo" id="dHice" rows="3" maxlength="600" placeholder="${hechas.length ? 'Ej.: ' + esc(hechas[0].t) : 'Lo más importante de tu día'}">${esc(D.hice || '')}</textarea></label>
      <label>Algo que agradeces<input class="campo" id="dGracias" maxlength="200" value="${esc(D.gracias || '')}"></label>
      <label>${preg}<input class="campo" id="dPregunta" maxlength="200" value="${esc(D.pregunta || '')}"></label>
      <button type="button" class="btn ${hoy && !ES.diario[f] ? 'gema' : ''}" data-accion="guardaDiario">${px('pluma')}${hoy && !ES.diario[f] ? 'Guardar · +' + REGLA.diarioGemas + ' gemas' : 'Guardar'}</button>
      ${hechas.length ? `<small class="nota">Ese día completaste: ${hechas.map((h) => esc(h.t)).slice(0, 6).join(' · ')}</small>` : ''}
    </div></div>
    <div class="col-b"><div class="pn calend">
      <div class="miga"><button type="button" class="btn mini" data-mes="-1" aria-label="Mes anterior">‹</button><b>${may(MESES[m - 1])} ${a}</b><button type="button" class="btn mini" data-mes="1" aria-label="Mes siguiente" ${mes >= isoDe().slice(0, 7) ? 'disabled' : ''}>›</button></div>
      <div class="sem">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="mesgrid">${celdas}</div>

// ---------- Guía de bienvenida (4 pasos) ----------
// Cada paso entra deslizándose hacia el lado al que avanzas; la barra de arriba se llena con el progreso.
// Lo interactivo responde al toque: el saludo cambia mientras escribes, las áreas rebotan al elegirlas,
// los huevos se mecen y el final es una ceremonia en la que el huevo llega a tu incubadora.
const INICIALES = () => CATALOGO.filter((e) => e.hab === 'pradera' && e.r === 'común').slice(0, 3);
const PASOS_GUIA = [['sol', 'Hola'], ['cal', 'Calendario'], ['tarea', 'Metas'], ['huevo', 'Huevo']];
function progresoGuia(p) {
  const antes = UI.pasoAntes == null ? p : UI.pasoAntes, pct = (k) => (k / (PASOS_GUIA.length - 1)) * 100;
  return `<div class="gprog" role="progressbar" aria-label="Paso ${p + 1} de ${PASOS_GUIA.length}" aria-valuemin="1" aria-valuemax="${PASOS_GUIA.length}" aria-valuenow="${p + 1}">
    <div class="gbarra"><i style="--de:${pct(antes)}%;--a:${pct(p)}%"></i></div>
    ${PASOS_GUIA.map(([ic, t], k) => `<span class="gp ${k < p ? 'hecho' : k === p ? 'actual' : ''}" style="--k:${k}"><span class="slot">${px(k < p ? 'ok' : ic)}</span><small>${t}</small></span>`).join('')}
  </div>`;
}
// Título con las letras en ola (cada letra entra un poquito después).

// ---------- montaje ----------
const VISTAS = { hoy: vistaHoy, parque: vistaParque, recinto: vistaRecinto, fauna: vistaFauna, imperio: vistaImperio, civilizacion: vistaCiv, diario: vistaDiario, mas: vistaMas };
const raiz = document.getElementById('app');
let mapaPos = null, ultimaVista = null;
function pinta(foco) {
  const clave = ES.listo ? UI.vista + (UI.sub || '') : 'guia' + UI.paso;
  const cuerpo = raiz.querySelector('.body'), top = cuerpo && ultimaVista === clave ? cuerpo.scrollTop : 0;
  raiz.innerHTML = ES.listo ? VISTAS[UI.vista]() : vistaGuia();
  document.documentElement.style.background = getComputedStyle(raiz.firstElementChild).getPropertyValue('--fondo') || '';
  const b = raiz.querySelector('.body');
  if (b) b.scrollTop = top;
  ultimaVista = clave;
  raiz.querySelectorAll('.mapa-vista').forEach((v) => {
    if (mapaPos) { v.scrollLeft = mapaPos[0]; v.scrollTop = mapaPos[1]; } else { v.scrollLeft = (v.scrollWidth - v.clientWidth) * 0.5; v.scrollTop = (v.scrollHeight - v.clientHeight) * 0.42; }
    let p0 = null;
    v.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse' || e.target.closest('button')) return; p0 = [e.clientX, e.clientY, v.scrollLeft, v.scrollTop]; v.setPointerCapture(e.pointerId); v.classList.add('arrastrando'); });
    v.addEventListener('pointermove', (e) => { if (p0) { v.scrollLeft = p0[2] - (e.clientX - p0[0]); v.scrollTop = p0[3] - (e.clientY - p0[1]); } });
    v.addEventListener('pointerup', () => { p0 = null; v.classList.remove('arrastrando'); });
    v.addEventListener('scroll', () => { mapaPos = [v.scrollLeft, v.scrollTop]; });
  });
  conectaGlobo();
  if (NUEVA_VISTA) { const b = raiz.querySelector(`.marca[data-rec="${NUEVA_VISTA}"]`); if (b) b.classList.add('recien'); }
  if (ES.listo && !document.querySelector('.ceremonia:not(.fuera)') && !UI.ceremoniaPend) {
    const sig = NUEVAS_ISLAS.length ? { tipo: 'isla', id: NUEVAS_ISLAS.shift() } : CEREMONIAS.shift();
    if (sig) { UI.ceremoniaPend = true; setTimeout(() => { UI.ceremoniaPend = false; muestraCeremonia(sig); }, 900); }
  }
  animaMonedas();
  if (foco) { const el = raiz.querySelector(foco); if (el) el.focus({ preventScroll: true }); }
}
// Texto que sube y se desvanece sobre lo que tocaste (varios mensajes, uno tras otro).
function flotar(msjs, el) {
  const lista = Array.isArray(msjs) ? msjs : [msjs];

// ---------- planeta (del prototipo) ----------
let globoUlt = 0;
const angG = (a) => ((a % 360) + 540) % 360 - 180;
function cuadroGlobo(t) {
  requestAnimationFrame(cuadroGlobo);
  const cv = document.getElementById('globo');
  if (!cv || t - globoUlt < 33) return;
  const k = quieto() ? 1 : 0.12;
  if (!GLOBO.arrastra) {
    if (GLOBO.auto && !quieto()) GLOBO.lon += 0.12;
    else { GLOBO.lon += angG(GLOBO.lonT - GLOBO.lon) * k; GLOBO.tilt += (GLOBO.tiltT - GLOBO.tilt) * k; }
    GLOBO.zoom += (GLOBO.zoomT - GLOBO.zoom) * k;
  }
  GLOBO.t = t / 1000; globoUlt = t;
  const pins = dibujaGlobo(cv, modoHora(), epocaVista()), e = cv.clientWidth / cv.width;
  for (const p of pins) { const b = document.querySelector(`#pinsGlobo ${p.sel}`); if (b) { b.style.left = p.x * e + 'px'; b.style.top = p.y * e + 'px'; b.hidden = !p.visible; } }
}
function conectaGlobo() {
  const cv = document.getElementById('globo');
  if (!cv || cv.dataset.listo) return;
  cv.dataset.listo = '1';
  cv.addEventListener('pointerdown', (e) => { GLOBO.arrastra = { x: e.clientX, y: e.clientY, lon: GLOBO.lon, tilt: GLOBO.tilt, movio: false }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    const a = GLOBO.arrastra; if (!a) return;
    const dx = e.clientX - a.x, dy = e.clientY - a.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) a.movio = true;
    GLOBO.lon = a.lon - (dx * 0.5) / GLOBO.zoom; GLOBO.tilt = Math.max(-60, Math.min(60, a.tilt + (dy * 0.3) / GLOBO.zoom));
  });
  cv.addEventListener('pointerup', (e) => {
    const a = GLOBO.arrastra; GLOBO.arrastra = null;
    if (a && !a.movio) { const r = cv.getBoundingClientRect(), reg = regionEn(cv, ((e.clientX - r.left) / r.width) * cv.width, ((e.clientY - r.top) / r.height) * cv.height); if (reg && reg !== GLOBO.sel) eligeRegion(reg); }
    else { GLOBO.auto = false; GLOBO.lonT = GLOBO.lon; GLOBO.tiltT = GLOBO.tilt; }
  });
}
function eligeRegion(id) {
  const R = REGIONES[id];
  GLOBO.sel = id; GLOBO.auto = false; GLOBO.lonT = R.c[0]; GLOBO.tiltT = R.c[1]; GLOBO.zoomT = id === 'oceania' || id === 'asiacentral' ? 1.7 : 2;
  const paises = paisesDe(id, epocaVista());

  pinta(`[data-region="${id}"]`);
}
function eligePais(p) {

  const [, lon, lat] = PAISES[p];
  GLOBO.lonT = lon; GLOBO.tiltT = lat; GLOBO.zoomT = Math.max(GLOBO.zoomT, 2.2);

}

const vibra = (p) => { try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch (_) { /* sin vibración */ } };

// Una explosión de cuadraditos de colores desde un elemento (o un punto).

// ---------- monedas: vuelan desde lo que tocaste y el contador sube ----------
let ultimasMonedas = null;
const PILDORA = { comida: ['p-comida', 'comida'], oro: ['p-oro', 'oro'], gemas: ['p-gema', 'gema'] };
function animaMonedas() {
  const ahora = { ...ES.monedas }, antes = ultimasMonedas, origen = UI.origen;
  ultimasMonedas = ahora; UI.origen = null;
  if (!antes) return;
  for (const [k, [clase, icono]] of Object.entries(PILDORA)) {
    if (ahora[k] === antes[k]) continue;
    const pill = raiz.querySelector('.' + clase), num = pill && pill.querySelector('b');
    if (!pill) continue;
    const sube = ahora[k] > antes[k];
    if (sube && !quieto()) {
      num.textContent = corto(antes[k]);
      vuelaPremio(origen, pill, icono, Math.min(6, 2 + Math.round(Math.log2(ahora[k] - antes[k] + 1) / 2)), () => cuenta(num, antes[k], ahora[k], pill));
    } else if (!sube) { pill.classList.remove('baja'); void pill.offsetWidth; pill.classList.add('baja'); }
  }
}
function vuelaPremio(origen, destino, icono, n, alLlegar) {
  const d = destino.getBoundingClientRect(), dx = d.left + 6, dy = d.top + d.height / 2;
  const ox = origen ? origen.left + origen.width / 2 : innerWidth / 2, oy = origen ? origen.top + origen.height / 2 : innerHeight / 2;
  let llegaron = 0;
  for (let k = 0; k < n; k++) {
    const v = document.createElement('i');
    v.className = 'vuela'; v.innerHTML = px(icono);
    v.style.left = ox + 'px'; v.style.top = oy + 'px';
    document.body.appendChild(v);
    const sx = (Math.random() - 0.5) * 70, sy = -30 - Math.random() * 40;
    v.animate([
      { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
      { transform: `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px)) scale(1.15)`, opacity: 1, offset: 0.3 },
      { transform: `translate(calc(-50% + ${dx - ox}px), calc(-50% + ${dy - oy}px)) scale(.7)`, opacity: 1 },
    ], { duration: 620 + k * 60, delay: k * 55, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'both' }).onfinish = () => {
      v.remove();
      destino.classList.remove('golpe'); void destino.offsetWidth; destino.classList.add('golpe');
      if (++llegaron === n && alLlegar) alLlegar();
    };
  }
}
// El número sube de a poco hasta el valor nuevo.
function cuenta(el, de, a, pill) {
  const t0 = performance.now(), dur = 520;
  const paso = (t) => {
    if (!el.isConnected) return;
    const f = Math.min(1, (t - t0) / dur), v = Math.round(de + (a - de) * (1 - (1 - f) ** 3));
    el.textContent = corto(v);
    if (f < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

  nivel: [[392, 0.08], [523, 0.08], [659, 0.08], [784, 0.2]], fanfarria: [[523, 0.09], [523, 0.06], [784, 0.24]],

function sfx(tipo) {

  try {
    AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    if (AUDIO.state === 'suspended') AUDIO.resume();
    let t = AUDIO.currentTime;
    for (const [f, d] of NOTAS[tipo]) {
      const o = AUDIO.createOscillator(), g = AUDIO.createGain();
      o.type = tipo === 'golpe' ? 'triangle' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AUDIO.destination); o.start(t); o.stop(t + d + 0.02);
      t += d * 0.85;
    }
  } catch (_) { /* sin audio */ }
}
// Onda que sale desde donde tocaste un botón.

// ---------- ruleta de la suerte ----------
// Focos alrededor, cada casilla con su ícono y cifra, flecha que hace tic al pasar las casillas,
// frenado con rebote y, si toca el premio mayor, destellos y lluvia de confeti.
// El premio ya se entregó en girarRuleta(); aquí solo se muestra.
function abreRuleta() {
  if (document.querySelector('.ceremonia:not(.fuera)')) return;
  const n = RULETA.length, paso = 360 / n, total = RULETA.reduce((a, c) => a + c.p, 0);
  const fondo = RULETA.map((c, k) => `${c.c} ${k * paso}deg ${(k + 1) * paso}deg`).join(', ');
  const casillas = RULETA.map((c, k) => `<span class="casilla ${c.raro ? 'rara' : ''}" style="rotate:${k * paso + paso / 2}deg"><i>${px(c.i)}<b>${c.t}</b></i></span>`).join('');
  const focos = Array.from({ length: 22 }, (_, k) => `<i class="foco ${k % 2 ? 'b' : ''}" style="rotate:${(k * 360) / 22}deg"></i>`).join('');
  const tabla = RULETA.map((c) => `<li><span style="background:${c.c}"></span>${c.n}${c.d ? ` <small>${c.d}</small>` : ''}<b>${Math.round((c.p / total) * 100)} %</b></li>`).join('');
  const pr = proximaRacha();
  const { capa, cierra } = capaCeremonia('ruleta-cer', '#f5b52e', `
    <small class="cer-k">Ruleta de la suerte</small>
    <div class="ruleta"><div class="focos">${focos}</div><i class="flecha"></i><div class="rueda" style="background:conic-gradient(${fondo})">${casillas}</div><button type="button" class="centro">¡Girar!</button></div>
    <b class="cer-n">Tienes ${ES.ruleta.tiradas} ${ES.ruleta.tiradas === 1 ? 'tirada' : 'tiradas'}</b>
    <p class="resultado">Toca el centro para girar.</p>
    <p class="garantia"></p>
    <div class="duo"><button type="button" class="btn oro otra" hidden>${px('ruleta')}Otra vez</button><button type="button" class="btn listo-b">Listo</button></div>
    <details class="probab"><summary>Premios y probabilidades</summary><ul>${tabla}</ul>
      <p>La ruleta se activa al completar dos semanas de racha: cada 14 días seguidos con misiones verificadas dan +${TIRADAS_RACHA} tiradas. Las próximas, a los ${pr.dias} días (te faltan ${pr.faltan}).</p></details>`);
  capa.setAttribute('aria-label', 'Ruleta de la suerte');
  const rueda = capa.querySelector('.rueda'), centro = capa.querySelector('.centro'), otra = capa.querySelector('.otra'), flecha = capa.querySelector('.flecha');
  const pinGarantia = () => { capa.querySelector('.garantia').innerHTML = `${px('gema')}Premio raro garantizado en ${faltaRaro()} ${faltaRaro() === 1 ? 'tirada' : 'tiradas'}`; };
  pinGarantia();
  let giro = 0, girando = false;
  const gira = () => {
    if (girando || ES.ruleta.tiradas <= 0) return;
    const res = girarRuleta();
    if (!res) return;
    girando = true; centro.disabled = true; otra.hidden = true; capa.classList.remove('mayor');
    capa.classList.add('girando');
    capa.querySelectorAll('.casilla').forEach((x) => x.classList.remove('gana'));
    capa.querySelector('.cer-n').textContent = res.garantia ? '¡Tirada garantizada!' : 'Girando…';
    capa.querySelector('.resultado').textContent = '…';
    const objetivo = 360 - (res.idx * paso + paso / 2) + (Math.random() - 0.5) * paso * 0.5;
    const vueltas = 360 * (5 + Math.floor(Math.random() * 2));
    giro += vueltas + ((objetivo - (giro % 360)) + 360) % 360;
    const dur = quieto() ? 0 : 4600;
    rueda.style.transition = `rotate ${dur}ms cubic-bezier(.1,.72,.12,1.015)`;
    rueda.style.rotate = giro + 'deg';
    // tic: la flecha salta cada vez que pasa una casilla; se frena con la rueda
    if (dur) { let t = 0, d = 38; while (t < dur - 250) { setTimeout(() => { sfx('toque'); flecha.classList.remove('tic'); void flecha.offsetWidth; flecha.classList.add('tic'); }, t); t += d; d *= 1.075; } }
    setTimeout(() => {
      girando = false; centro.disabled = false; capa.classList.remove('girando');
      const C = RULETA[res.idx];
      capa.querySelector('.cer-n').textContent = res.n;
      capa.querySelector('.resultado').textContent = res.d || '¡Bien!';
      capa.querySelectorAll('.casilla')[res.idx].classList.add('gana');
      pinGarantia();
      if (C.k === 'mayor') {
        capa.classList.add('mayor'); sfx('nivel'); vibra([40, 60, 40, 60, 120]);
        for (let k = 0; k < 5; k++) setTimeout(() => chispas([innerWidth * (0.15 + 0.7 * Math.random()), innerHeight * 0.15], { n: 40, fuerza: 2.6 }), k * 280);
      } else { sfx(C.raro ? 'fanfarria' : 'cofre'); vibra(C.raro ? [30, 50, 30] : [20, 30, 20]); }
      chispas(capa.querySelector('.ruleta'), { n: C.raro ? 44 : 26, fuerza: C.raro ? 2.6 : 1.8, colores: [C.c, '#ffffff', '#ffe08a'] });
      otra.hidden = ES.ruleta.tiradas <= 0;
      if (!otra.hidden) otra.innerHTML = `${px('ruleta')}Otra vez · ${ES.ruleta.tiradas}`;
    }, dur + 80);
  };
  centro.addEventListener('click', gira);
  otra.addEventListener('click', gira);
  capa.querySelector('.listo-b').addEventListener('click', () => { if (!girando) cierra(); });
  centro.focus({ preventScroll: true });
}

// Dos semanas de racha: la ruleta se enciende.

// Lee los eventos de hoy si hace falta (cada 15 minutos o al cambiar de día).
let calPend = false;
async function refrescaCalendario(forzar = false) {
  if (calPend || (!MODO_DEMO && !tokenVivo())) return;
  if (!forzar && EVENTOS.fecha === isoDe() && Date.now() - EVENTOS.t < 15 * 60000) return;
  calPend = true;
  try { await traeEventosHoy(); } catch (x) { if (x.message !== 'sesion') EVENTOS.error = 'No pude leer tu calendario: ' + x.message; }
  calPend = false;
  if (ES.listo && UI.vista === 'hoy') pinta();
}
async function entraConGoogle(primeraVez, boton) {
  UI.ocupado = true; GOO.error = null;
  try {
    await conectaGoogle({ primeraVez });
    await sincroniza();
    UI.cals = null;
    flotar(['¡Conectada!', GOO.correo], boton);
    refrescaCalendario(true);
  } catch (x) { GOO.error = x.message; }
  UI.ocupado = false;
  pinta();
}

async function accion(a, b) {
  switch (a) {
    case 'conectar': return entraConGoogle(true, b);
    case 'reconectar': return entraConGoogle(false, b);
    case 'desconectar':
      if (!confirm('¿Cerrar la sesión de Google en este dispositivo? Tu progreso sigue guardado en tu Drive.')) return;
      desconectaGoogle(); EVENTOS = { fecha: null, lista: [], t: 0 }; UI.cals = null;
      cargaEstado('local'); return pinta();
    case 'sincronizar':
      try { await subeADrive(ES); flotar('Copia guardada en tu Drive', b); } catch (x) { GOO.error = x.message === 'sesion' ? 'La sesión se durmió: reconecta.' : x.message; }
      refrescaCalendario(true); return pinta();
    case 'guardaClientId': {
      const v = document.getElementById('clientId').value.trim();
      try { v ? localStorage.setItem('odisea.mundo.clientId', v) : localStorage.removeItem('odisea.mundo.clientId'); } catch (_) { /* nada */ }
      flotar('ID guardado', b); return pinta();
    }
    case 'calendario': return refrescaCalendario(true);
    case 'cargaCals':
      UI.ocupado = true; pinta();
      try { UI.cals = await listaCalendarios(); } catch (x) { GOO.error = x.message === 'sesion' ? 'Reconecta tu cuenta para ver los calendarios.' : x.message; }
      UI.ocupado = false; return pinta();
    case 'guardaCals': {
      const ids = [...raiz.querySelectorAll('[data-cal]')].filter((x) => x.checked).map((x) => x.dataset.cal);
      ES.prefs.calendarios = ids; ES.prefs.todoElDia = document.getElementById('todoElDia').checked;
      guarda(); flotar('Calendarios guardados', b); refrescaCalendario(true); return ir('mas');
    }
    case 'agendar': {
      const que = document.getElementById('agQue').value.trim(), dia = document.getElementById('agDia').value, hora = document.getElementById('agHora').value;
      const min = +document.getElementById('agMin').value || 60, metaSel = document.getElementById('agMeta'), meta = metaSel && ES.metas.find((x) => x.id === metaSel.value);
      if (!que || !dia || !hora) { flotar('Escribe qué, el día y la hora', b); return; }
      // si eligió una meta, el título lleva su acción para que el evento cuente para ella
      const titulo = meta && !metaDeTexto(que) ? que + ' · ' + meta.accion : que;
      b.disabled = true;
      try {
        await creaEvento({ titulo, inicio: new Date(dia + 'T' + hora), min, meta: meta && meta.accion });
        UI.hoja = null; vibra(15);
        await refrescaCalendario(true);
        pinta(); flotar(['¡Agendado!', dia === isoDe() ? 'Ya está en tus misiones de hoy' : 'Aparecerá ese día en Hoy'], raiz.querySelector('.list'));
        chispas(raiz.querySelector('.list'), { n: 16 });
      } catch (x) { b.disabled = false; flotar(x.message === 'sesion' ? 'Reconecta tu cuenta de Google' : x.message, b); }
      return;
    }
    // Sin prueba no se marca: la misión vuelve a empezar (se detiene el temporizador y se olvida la foto revisada).
    case 'reiniciar': {
      const mi = misionesDeHoy().find((x) => x.id === UI.verificar);
      UI.hoja = null;
      if (UI.fotoRes && UI.fotoRes.url) URL.revokeObjectURL(UI.fotoRes.url);
      UI.fotoRes = null;
      if (mi && ES.enCurso && ES.enCurso.id === mi.id) { ES.enCurso = null; guarda(); }
      pinta();
      return mi && flotar(['Misión reiniciada', 'Cuenta cuando la demuestres'], raiz.querySelector(`[data-mision="${CSS.escape(mi.id)}"]`) || b);
    }
    case 'usarFoto': {
      const R = UI.fotoRes, mi = R && R.ok && misionesDeHoy().find((x) => x.id === R.id);
      if (!mi) return;
      recuerdaFoto(R, mi);
      if (R.url) URL.revokeObjectURL(R.url);
      UI.fotoRes = null; UI.hoja = null;
      const msj = completar(mi, 'foto');
      UI.recienHecha = mi.id; pinta(); UI.recienHecha = null;
      const el = raiz.querySelector(`[data-mision="${CSS.escape(mi.id)}"]`);
      if (el) { chispas(el, { n: 18 }); vibra(18); }
      return flotar(msj, el || b);
    }
    case 'agregaTarea': {
      const m = agregaTarea(document.getElementById('tareaTexto').value);
      UI.hoja = null; pinta(); return flotar(m, raiz.querySelector('.agrega'));
    }
    case 'guardaDiario': {
      const f = UI.diaDiario || isoDe();
      const m = guardaDiario(f, { hice: document.getElementById('dHice').value.trim(), gracias: document.getElementById('dGracias').value.trim(), pregunta: document.getElementById('dPregunta').value.trim(), animo: (ES.diario[f] || {}).animo || UI.animoNuevo || null });
      UI.animoNuevo = null; pinta(); return flotar(m, raiz.querySelector('[data-accion="guardaDiario"]'));
    }
    case 'guardaMetas': leeMetas(); guarda(); aplicaAlMotor(); flotar('Metas guardadas', b); return ir('mas');
    case 'guardaPrefs':
      ES.perfil.nombre = document.getElementById('pNombre').value.trim();
      ES.prefs.alDia = Math.max(1, Math.min(12, +document.getElementById('pAlDia').value || 4));
      ES.prefs.sonido = document.getElementById('pSonido').checked;
      guarda(); flotar('Preferencias guardadas', b); return ir('mas');
    case 'avanzar': { chispas(b, { n: 30, fuerza: 2 }); vibra([30, 50, 30]); const m = avanzarEpoca(); UI.epoca = null; pinta(); return flotar(m, raiz.querySelector('.epocas')); }
    case 'guia': ES.listo = false; UI.paso = 0; UI.guiaAreas = Object.fromEntries(ES.metas.map((m) => [m.area, m.veces])); return pinta();
    case 'terminaGuia': {
      ES.prefs.alDia = Math.max(1, Math.min(12, +document.getElementById('gAlDia').value || 4));
      const antes = Object.fromEntries(ES.metas.map((m) => [m.area, m]));
      ES.metas = Object.entries(UI.guiaAreas).map(([k, v]) => (antes[k] ? { ...antes[k], veces: v, dias: diasPara(v) } : nuevaMeta(k, v)));
      const primera = !ES.stats.misiones && !ES.parque.individuos.length;
      ES.listo = true;
      const m = primera && UI.guiaHuevo && !ES.parque.huevo ? comprarHuevo(UI.guiaHuevo, true) : [];
      // El parque arranca con la incubadora y una pradera para la primera cría (las especies iniciales son de pradera).
      if (primera && !ES.parque.islas.length) creaIsla(ESPECIE[UI.guiaHuevo] ? ESPECIE[UI.guiaHuevo].hab : 'pradera');
      aplicaAlMotor(); guarda();
      const entrar = () => { ir('hoy'); flotar(['¡A jugar!', ...m], raiz.querySelector('.quest')); };
      // Primera vez: ceremonia de cierre (el huevo llega a la incubadora). Al volver a la guía desde Más, directo.
      return primera && UI.guiaHuevo ? presentaBienvenida({ esp: UI.guiaHuevo, metas: ES.metas.length, nombre: ES.perfil.nombre }, entrar) : entrar();
    }
    case 'exportar': {
      const url = URL.createObjectURL(new Blob([JSON.stringify(ES, null, 2)], { type: 'application/json' }));
      const l = document.createElement('a'); l.href = url; l.download = `odisea-${isoDe()}.json`; l.click();
      return setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    case 'borrar':
      if (!confirm('¿Borrar todo tu progreso y empezar de cero? Si tienes sesión, también se reemplaza la copia de tu Drive.')) return;
      ES = estadoNuevo(); aplicaAlMotor(); guarda(); UI.paso = 0; UI.guiaAreas = {}; UI.guiaHuevo = null; olvida('mapa'); olvida('rec-');
      return pinta();
  }
}
// Lee lo editado en Metas y objetivos.
function leeMetas() {
  for (const el of raiz.querySelectorAll('.meta[data-meta]')) {
    const m = ES.metas.find((x) => x.id === el.dataset.meta);
    if (!m) continue;
    const v = (k) => el.querySelector(`[data-campo="${k}"]`).value;
    m.accion = v('accion').trim() || AREAS[m.area].accion;
    m.min = Math.max(5, Math.min(240, +v('min') || m.min));
    const veces = Math.max(1, Math.min(7, +v('veces') || m.veces));
    if (veces !== m.veces) { m.veces = veces; if (m.dias.length !== veces) m.dias = diasPara(veces); }
    m.premio = premioDe(m.min);
  }
}
